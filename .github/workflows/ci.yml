name: Clinical Engineering Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php-and-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Lint PHP
        run: find src public bin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run application tests
        run: php tests/run.php
      - name: Check JavaScript syntax
        run: node --check public/assets/app.js
      - name: Demo server and HTTP smoke
        run: |
          php -S 127.0.0.1:8765 -t public public/router.php >/tmp/codivanta.log 2>&1 &
          php bin/seed.php
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8765/ | grep 'CODIVANTA'
          curl -fsS http://127.0.0.1:8765/assets/app.js | grep 'AI coding'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/v1/patients)" = '401'
      - name: Secret hygiene
        run: |
          ! git grep -nE '(BEGIN (RSA|OPENSSH) PRIVATE KEY|sk-[A-Za-z0-9]{30,})' -- ':!tests/*'
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag codivanta-ai:ci .
