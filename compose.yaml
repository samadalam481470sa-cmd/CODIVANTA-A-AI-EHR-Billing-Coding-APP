services:
  codivanta:
    build: .
    environment:
      CODIVANTA_DEMO_MODE: '1'
      CODIVANTA_DATA: /app/data/state.json
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - codivanta_synthetic_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD','php','-r','exit(@file_get_contents("http://127.0.0.1:8080/health") ? 0 : 1);']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  codivanta_synthetic_data:
